# Build + push Artifact Registry + deploy Cloud Run.
# Nombre canónico = repo Git: portal-ai-data-backend (AR + imagen + Cloud Run).
# Uso (Cloud Shell, backend/): gcloud builds submit --config cloudbuild.yaml --project platform-partners-des

substitutions:
  _REGION: us-central1
  _APP: portal-ai-data-backend
  _COMPUTE_PROJECT: platform-partners-des
  _RUNTIME_SA: etl-servicetitan@platform-partners-des.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

# Tag único: BUILD_ID (siempre existe). SHORT_SHA está vacío en `gcloud builds submit` sin trigger Git.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:latest

steps:
  - id: assert-compute-project
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$$PROJECT_ID" != "$_COMPUTE_PROJECT" ]; then
          echo "Este pipeline solo se ejecuta en $_COMPUTE_PROJECT (recibido: $$PROJECT_ID)" >&2
          exit 1
        fi

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:latest
      - .

  - id: push-build
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:${BUILD_ID}

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_APP}
      - --project
      - ${_COMPUTE_PROJECT}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP}/${_APP}:${BUILD_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --timeout
      - "60s"
      - --concurrency
      - "80"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --set-env-vars
      - PYTHONUNBUFFERED=1,GOOGLE_CLOUD_PROJECT=${_COMPUTE_PROJECT}
